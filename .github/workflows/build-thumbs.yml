name: Build SKU thumbnails

on:
  workflow_dispatch: {}
  push:
    paths:
      - "worker/images.csv"
      - "worker/build_thumbs.py"
      - ".github/workflows/build-thumbs.yml"

permissions:
  contents: write

concurrency:
  group: build-sku-thumbs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests

      - name: Build thumbnails (200 + 300)
        run: |
          python worker/build_thumbs.py --csv worker/images.csv --out for_price --sizes 200 300 --state worker/state.json --failures worker/failures.csv

      - name: Commit & push changes (if any)
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add for_price worker/state.json worker/failures.csv
            git commit -m "Build thumbnails from worker/images.csv"
            git push
            echo "✅ Pushed updated thumbnails"
          else
            echo "✅ No changes to commit"
          fi
