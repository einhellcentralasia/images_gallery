name: Sync SharePoint Media

on:
  schedule:
    # 22:00 Asia/Almaty (UTC+5) == 17:00 UTC
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sharepoint-media
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg qpdf awscli

      - name: Sync media from SharePoint
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: python scripts/sync_sharepoint_to_repo.py


      - name: Validate media web-playback layout
        run: python scripts_check_media_health.py --fail-on-slow

      - name: Detect repository changes
        id: repo_changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Repository has changes"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Repository unchanged"
          fi

      - name: Commit SharePoint changes locally
        if: steps.repo_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync media from sharepoint"

      - name: Sync media delta to R2
        env:
          # Cloudflare R2 API token fields from dashboard:
          # Access Key ID, Secret Access Key, and jurisdiction-specific endpoint.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: ${{ secrets.R2_S3_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_SYNC_TAG: r2-last-synced
        run: |
          set -euo pipefail
          test -n "${R2_ENDPOINT_URL}"
          test -n "${R2_BUCKET}"
          aws --version
          python scripts/sync_repo_delta_to_r2.py

      - name: Commit and push if changed
        if: steps.repo_changes.outputs.changed == 'true'
        run: |
          git push

      - name: Push R2 sync marker tag
        run: |
          git push origin "refs/tags/r2-last-synced" --force
